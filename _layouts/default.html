<head>
<!-- Lightweight classless CSS for instant modern styling -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@exampledev/new.css@1.1.2/new.min.css">
</head>
<body>
<script>
  const quoteBtn = document.getElementById('quote-btn');
  let selectedText = '';
  let selectedRange = null;

  document.addEventListener('mouseup', (e) => {
    if (quoteBtn.contains(e.target)) return;

    const selection = window.getSelection();
    const text = selection.toString().trim();

    if (text.length > 0 && selection.rangeCount > 0) {
      selectedText = text;
      selectedRange = selection.getRangeAt(0);
      const rect = selectedRange.getBoundingClientRect();

      quoteBtn.style.top = `${Math.max(10, rect.top - 45)}px`;
      quoteBtn.style.left = `${Math.max(10, rect.left + (rect.width / 2) - 75)}px`;
      quoteBtn.style.display = 'flex';
    } else {
      quoteBtn.style.display = 'none';
    }
  });

  quoteBtn.addEventListener('click', async () => {
    if (!selectedRange || !selectedText) return;

    // Find the enclosing list item (<li>) or block element containing the selection
    const startNode = selectedRange.startContainer;
    const currentElem = startNode.nodeType === Node.TEXT_NODE ? startNode.parentElement : startNode;
    const listItem = currentElem.closest('li, p, tr, div');

    let startLineNum = null;
    let prevLineText = '';
    let nextLineText = '';

    if (listItem) {
      // Get line number if inside an ordered or unordered list
      const parentList = listItem.parentElement;
      if (parentList) {
        const siblings = Array.from(parentList.children);
        const index = siblings.indexOf(listItem);
        if (index !== -1) {
          startLineNum = index + 1;
        }
      }

      // Capture line before
      const prevElem = listItem.previousElementSibling;
      if (prevElem) {
        prevLineText = prevElem.innerText.trim();
      }

      // Capture line after
      const nextElem = listItem.nextElementSibling;
      if (nextElem) {
        nextLineText = nextElem.innerText.trim();
      }
    }

    // Build the line number reference string
    const lineRefHeader = startLineNum ? `*Regarding Line ${startLineNum}:*\n\n` : '';

    // Format the snippet: line before, bold target selection, line after
    let snippetLines = [];
    if (prevLineText) snippetLines.push(prevLineText);
    
    // Bold the target selected text
    snippetLines.push(`**${selectedText}**`);
    
    if (nextLineText) snippetLines.push(nextLineText);

    // Turn all lines into Markdown blockquotes
    const formattedQuote = lineRefHeader + snippetLines.map(line => `> ${line}`).join('\n') + '\n\n';

    try {
      await navigator.clipboard.writeText(formattedQuote);
    } catch (err) {
      console.error('Failed to copy text: ', err);
    }

    quoteBtn.style.display = 'none';

    // Scroll smoothly down to Giscus
    const giscusContainer = document.querySelector('.giscus');
    if (giscusContainer) {
      giscusContainer.scrollIntoView({ behavior: 'smooth' });
    }

    window.getSelection().removeAllRanges();
  });
</script>
</body>
